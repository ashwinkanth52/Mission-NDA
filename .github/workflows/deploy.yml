name: Deploy Mission NDA — Phase 1 v15

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production and QA sites
        run: |
          set -e
          test -s index.html
          test -s qa/index.html
          python3 - <<'PY'
          from pathlib import Path
          prod=Path("index.html").read_text(encoding="utf-8")
          qa=Path("qa/index.html").read_text(encoding="utf-8")
          checks={
            "prod_title":"<title>Mission NDA — Phase 1 v15</title>" in prod,
            "prod_storage":"missionNDA_progress_v2" in prod,
            "qa_title":"<title>Mission NDA — Phase 1 v15 — QA</title>" in qa,
            "qa_storage":"missionNDA_progress_qa_v1" in qa,
            "qa_banner":"QA / TEST ENVIRONMENT" in qa,
            "prod_not_qa":"missionNDA_progress_qa_v1" not in prod,
            "qa_not_prod":"missionNDA_progress_v2" not in qa,
            "student":"Sriram's Space" in prod and "Sriram's Space" in qa,
            "parent":"Parent Space" in prod and "Parent Space" in qa,
            "curriculum":"M01" in prod and "M20" in prod and "M01" in qa and "M20" in qa,
            "assessment":"Submit assessment" in prod and "Submit assessment" in qa,
            "responsive":"@media(max-width:760px)" in prod and "@media(max-width:760px)" in qa
          }
          for k,v in checks.items(): print(f"CHECK {k}={v}")
          if not all(checks.values()): raise SystemExit("Environment validation failed")
          print("Environment validation passed")
          PY

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site/qa
          cp index.html _site/index.html
          cp qa/index.html _site/qa/index.html
          cmp index.html _site/index.html
          cmp qa/index.html _site/qa/index.html
          echo "Production:"
          sha256sum _site/index.html
          echo "QA:"
          sha256sum _site/qa/index.html

      - name: Upload Pages artifact
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Production and QA URLs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          PROD_URL="${PAGES_URL%/}/"
          QA_URL="${PAGES_URL%/}/qa/"
          echo "Checking production: $PROD_URL"
          echo "Checking QA: $QA_URL"

          for attempt in 1 2 3 4 5 6; do
            PROD_OK=false
            QA_OK=false

            if curl -fsSL --max-time 20 "$PROD_URL" -o /tmp/prod.html; then
              grep -q 'Mission NDA — Phase 1 v15</title>' /tmp/prod.html &&               grep -q 'missionNDA_progress_v2' /tmp/prod.html &&               ! grep -q 'QA / TEST ENVIRONMENT' /tmp/prod.html &&               PROD_OK=true
            fi

            if curl -fsSL --max-time 20 "$QA_URL" -o /tmp/qa.html; then
              grep -q 'Mission NDA — Phase 1 v15 — QA</title>' /tmp/qa.html &&               grep -q 'missionNDA_progress_qa_v1' /tmp/qa.html &&               grep -q 'QA / TEST ENVIRONMENT' /tmp/qa.html &&               ! grep -q 'missionNDA_progress_v2' /tmp/qa.html &&               QA_OK=true
            fi

            if [ "$PROD_OK" = true ] && [ "$QA_OK" = true ]; then
              echo 'LIVE_ENVIRONMENT_CHECK passed'
              exit 0
            fi

            echo "Live environment check not ready or stale; retry $attempt/6"
            sleep 10
          done

          echo 'LIVE_ENVIRONMENT_CHECK failed'
          exit 1
