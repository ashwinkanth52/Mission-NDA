name: Deploy Mission NDA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known payload transcription errors
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          targets = {
            "04.b64": "f2d325aa9aa8c05c7698d92991edc59e274ed6f1",
            "09.b64": "75a9e4222f05767584b537d10890928522cd97c1",
          }
          chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="

          def blob_sha(x):
              return hashlib.sha1(("blob "+str(len(x))+"\0"+x).encode()).hexdigest()

          for name,target in targets.items():
              p=Path("build/payload")/name
              s=p.read_text()
              if blob_sha(s)==target:
                  continue
              found=None
              if name=="09.b64":
                  for i in range(len(s)+1):
                      for ch in chars:
                          c=s[:i]+ch+s[i:]
                          if blob_sha(c)==target:
                              found=c; break
                      if found: break
              else:
                  for i in range(len(s)):
                      old=s[i]
                      for ch in chars:
                          if ch==old: continue
                          c=s[:i]+ch+s[i+1:]
                          if blob_sha(c)==target:
                              found=c; break
                      if found: break
              if not found:
                  raise SystemExit("Could not repair "+name)
              p.write_text(found)
              print("Repaired",name)

          print("Payload repair complete")
          PY

      - name: Rebuild approved Phase 1 v12 site
        run: |
          mkdir -p _site
          cat build/payload/*.b64 | tr -d '\n' | base64 -d > /tmp/mission-nda-v12.gz
          gzip -t /tmp/mission-nda-v12.gz
          gzip -dc /tmp/mission-nda-v12.gz > _site/index.html
          test -s _site/index.html
          grep -q "Mission NDA" _site/index.html
          grep -q "Sriram" _site/index.html

      - name: Upload Pages artifact
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
