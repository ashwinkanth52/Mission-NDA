name: Deploy Mission NDA — Phase 1 v15

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical site
        run: |
          test -s index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path("index.html").read_text(encoding="utf-8")
          checks={
            "doctype":"<!doctype html>" in h.lower(),
            "title":"<title>Mission NDA — Phase 1 v15</title>" in h,
            "landing_version":'id="missionReleaseVersion"' in h and "Phase 1 — v15" in h,
            "no_old_versions":not any(x in h for x in ["Phase 1 — v11","Phase 1 — v12","Phase 1 — v13","Phase 1 — v14"]),
            "student_login":"SRIRAM2026" in h,
            "parent_login":"PARENT2026" in h,
            "student_space":"Sriram's Space" in h,
            "parent_space":"Parent Space" in h,
            "curriculum":"M01" in h and "M20" in h,
            "assessment":"Submit assessment" in h,
            "review":"Review your answers" in h,
            "persistence":"missionNDA_progress_v2" in h,
            "export":"exportProgress" in h,
            "import":"importProgress" in h,
            "responsive":"@media(max-width:760px)" in h
          }
          for k,v in checks.items(): print(f"CHECK {k}={v}")
          if not all(checks.values()): raise SystemExit("Canonical site validation failed")
          print("Canonical site validation passed: Phase 1 — v15")
          PY

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp index.html /tmp/deployed-index.html
          sha256sum index.html _site/index.html /tmp/deployed-index.html
          cmp index.html _site/index.html
          cmp index.html /tmp/deployed-index.html

      - name: Upload Pages artifact
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Verify live GitHub Pages site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          echo "Checking $PAGES_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$PAGES_URL" -o /tmp/live.html; then
              grep -q 'Mission NDA — Phase 1 v15' /tmp/live.html && \
              grep -q 'id="missionReleaseVersion"' /tmp/live.html && \
              grep -q 'Phase 1 — v15' /tmp/live.html && \
              grep -q "Sriram's Space" /tmp/live.html && \
              grep -q 'Parent Space' /tmp/live.html && \
              ! grep -q 'Phase 1 — v12' /tmp/live.html && \
              ! grep -q 'Phase 1 — v13' /tmp/live.html && \
              ! grep -q 'Phase 1 — v14' /tmp/live.html && \
              echo 'LIVE_SITE_CHECK passed' && exit 0
            fi
            echo "Live site not ready or stale; retry $attempt/6"
            sleep 10
          done
          echo 'LIVE_SITE_CHECK failed'
          exit 1
